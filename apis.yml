aid: healthcatalyst
name: Healthcatalyst
description: >-
  Health Catalyst is a healthcare data, analytics, and AI company that helps
  healthcare organizations achieve measurable clinical, financial, and
  operational improvement. Its flagship platform, Health Catalyst Ignite, is a
  healthcare-specific data and analytics ecosystem built on Azure Databricks
  that natively integrates clinical, financial, and operational data and exposes
  pre-built standard APIs, healthcare data models, and self-service analytics
  tools. Health Catalyst serves more than 1,100 organizations and maintains a
  deep security and compliance posture (SOC 2 Type II, HITRUST CSF, HIPAA, ISO
  27001, NIST CSF, TX-RAMP). Surfaced in the API Evangelist network as a
  portfolio company of Norwest Venture Partners and enriched by the pipeline.
